<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aventura Literaria - 1° y 2° Básico</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;700;900&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Quicksand', sans-serif;
            background-color: #f0f9ff;
            background-image: radial-gradient(#bae6fd 2px, transparent 2px);
            background-size: 30px 30px;
            user-select: none; /* Evita que los niños seleccionen texto por accidente */
            overflow-x: hidden;
        }

        /* Animaciones para feedback */
        @keyframes bounce-success {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }
        .animate-bounce-success {
            animation: bounce-success 0.5s ease-in-out;
            background-color: #4ade80 !important; /* Verde éxito */
            color: white !important;
            border-color: #22c55e !important;
        }

        @keyframes shake-error {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            50% { transform: translateX(10px); }
            75% { transform: translateX(-10px); }
        }
        .animate-shake-error {
            animation: shake-error 0.5s ease-in-out;
            background-color: #f87171 !important; /* Rojo error */
            color: white !important;
            border-color: #ef4444 !important;
        }

        /* Ejemplos Reales para los tipos de texto */
        .real-doc {
            width: 180px;
            height: 240px;
            background: white;
            border-radius: 12px;
            padding: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            border: 3px solid #e2e8f0;
            cursor: pointer;
            transition: transform 0.2s, border-color 0.2s;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }
        .real-doc:hover {
            transform: translateY(-5px) scale(1.02);
            border-color: #38bdf8;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.2);
        }

        /* Estilo Poema Real */
        .real-poem { font-family: 'Georgia', serif; text-align: center; background: #fffbeb; justify-content: center;}
        .real-poem h4 { font-size: 16px; color: #b45309; margin-bottom: 12px; font-weight: bold;}
        .real-poem p { margin: 2px 0; font-style: italic; color: #475569; font-size: 12px; line-height: 1.4;}
        
        /* Estilo Noticia Real */
        .real-news { font-family: 'Times New Roman', serif; background: #f8fafc; }
        .real-news .header { text-align: center; border-bottom: 2px solid #334155; padding-bottom: 4px; margin-bottom: 6px; font-weight: 900; font-size: 18px; letter-spacing: 1px;}
        .real-news .headline { font-size: 14px; font-weight: bold; line-height: 1.2; margin-bottom: 6px; color: #0f172a;}
        .real-news .content { display: flex; flex-direction: column; gap: 4px; flex-grow: 1;}
        .real-news .text { font-size: 10px; text-align: justify; color: #334155; line-height: 1.3;}
        .real-news .img-placeholder { width: 100%; height: 50px; background: #cbd5e1; margin-bottom: 6px; display: flex; align-items: center; justify-content: center; font-size: 24px; border-radius: 4px;}

        /* Estilo Receta Real */
        .real-recipe { font-family: 'Quicksand', sans-serif; background: #f0fdf4; border: 3px dashed #86efac; }
        .real-recipe h4 { font-size: 15px; color: #166534; text-align: center; border-bottom: 2px solid #bbf7d0; margin-bottom: 8px; font-weight: 900; padding-bottom: 4px;}
        .real-recipe .section-title { font-size: 11px; font-weight: bold; color: #14532d; margin-top: 4px;}
        .real-recipe ul, .real-recipe ol { padding-left: 16px; margin: 4px 0; font-size: 11px; color: #166534; font-weight: 600;}
        .real-recipe li { margin-bottom: 3px; }
        
        /* Portada de Libro Interactiva */
        .book-cover {
            width: 260px;
            height: 340px;
            background: linear-gradient(135deg, #38bdf8, #818cf8);
            border-radius: 8px 16px 16px 8px;
            box-shadow: 
                inset 4px 0 10px rgba(0,0,0,0.1),
                10px 10px 15px rgba(0,0,0,0.2);
            position: relative;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            border-left: 12px solid #1e3a8a; /* Lomo del libro */
        }
        .book-zone {
            background: rgba(255, 255, 255, 0.9);
            padding: 12px 20px;
            border-radius: 12px;
            border: 3px dashed transparent;
            cursor: pointer;
            text-align: center;
            width: 90%;
            transition: all 0.2s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .book-zone:hover {
            transform: scale(1.05);
            border-color: #fbbf24;
        }
        .book-zone h3 { margin: 0; font-weight: 900; }
        .book-zone p { margin: 0; font-weight: 700; color: #475569; }
        
        .zone-title { font-size: 1.5rem; color: #1e40af; }
        .zone-author { font-size: 1.2rem; color: #b45309; margin-top: auto; margin-bottom: 15px;}
        .zone-distractor { font-size: 0.8rem; background: transparent; box-shadow: none; padding: 5px; opacity: 0.8;}
        .zone-distractor:hover { background: rgba(255,255,255,0.5); }

    </style>
</head>
<body class="h-screen w-screen flex flex-col items-center justify-center p-4">

    <!-- Contenedor Principal del Juego -->
    <div id="game-container" class="w-full max-w-3xl bg-white rounded-3xl shadow-2xl overflow-hidden relative min-h-[600px] flex flex-col">
        
        <!-- Pantalla de Inicio -->
        <div id="screen-start" class="flex flex-col items-center justify-center flex-grow p-8 text-center bg-gradient-to-b from-blue-50 to-white">
            <h1 class="text-5xl font-black text-blue-600 mb-6 drop-shadow-sm">📖 Aventura<br>Literaria</h1>
            <p class="text-xl text-slate-600 mb-8 font-bold">¡Juega y aprende sobre palabras, libros y textos!</p>
            <div class="flex gap-4">
                <div class="text-6xl animate-bounce">🍜</div>
                <div class="text-6xl animate-bounce" style="animation-delay: 0.2s">📚</div>
                <div class="text-6xl animate-bounce" style="animation-delay: 0.4s">📰</div>
            </div>
            <button onclick="startGame()" class="mt-12 bg-green-500 hover:bg-green-600 text-white text-3xl font-black py-4 px-12 rounded-full shadow-[0_8px_0_#16a34a] hover:shadow-[0_4px_0_#16a34a] hover:translate-y-1 transition-all">
                ¡JUGAR!
            </button>
        </div>

        <!-- Pantalla de Juego -->
        <div id="screen-game" class="hidden flex-col flex-grow">
            <!-- Barra de progreso -->
            <div class="bg-slate-100 p-4 flex items-center justify-between shadow-sm z-10">
                <span class="font-bold text-slate-500" id="progress-text">1 / 30</span>
                <div class="flex-grow mx-4 h-4 bg-slate-200 rounded-full overflow-hidden">
                    <div id="progress-bar" class="h-full bg-blue-500 rounded-full transition-all duration-300" style="width: 0%;"></div>
                </div>
                <span class="font-black text-yellow-500 text-xl" id="score-text">⭐ 0</span>
            </div>

            <!-- Área de la Pregunta -->
            <div class="flex-grow flex flex-col items-center justify-start p-6 bg-slate-50 relative">
                <h2 id="question-text" class="text-2xl md:text-3xl font-black text-center text-slate-800 mb-8 max-w-xl">
                    Pregunta
                </h2>
                
                <!-- Contenedor dinámico donde se inyectará el contenido según el tipo de pregunta -->
                <div id="interactive-area" class="w-full flex-grow flex items-center justify-center">
                    <!-- Contenido dinámico -->
                </div>
            </div>
        </div>

        <!-- Pantalla Final -->
        <div id="screen-end" class="hidden flex-col items-center justify-center flex-grow p-8 text-center bg-gradient-to-b from-yellow-50 to-white overflow-y-auto">
            <h1 class="text-5xl font-black text-yellow-500 mb-4 mt-8">¡Felicidades! 🎉</h1>
            <p class="text-2xl text-slate-700 font-bold mb-6">Has completado todos los desafíos.</p>
            <div class="bg-white p-6 rounded-3xl shadow-lg border-4 border-yellow-200 mb-8 w-full max-w-md">
                <p class="text-xl text-slate-500 font-bold uppercase tracking-wide">Puntuación Final</p>
                <p id="final-score" class="text-6xl font-black text-blue-600 mt-2">30/30</p>
            </div>

            <!-- Contenedor de Feedback -->
            <div id="feedback-container" class="bg-blue-50 p-6 rounded-2xl border-2 border-blue-200 text-left mb-8 w-full max-w-xl hidden">
            </div>

            <button onclick="resetGame()" class="bg-blue-500 hover:bg-blue-600 text-white text-2xl font-black py-4 px-10 rounded-full shadow-[0_8px_0_#2563eb] hover:shadow-[0_4px_0_#2563eb] hover:translate-y-1 transition-all mb-8">
                Volver a Jugar
            </button>
        </div>

    </div>

    <script>
        // --- BASE DE DATOS DE DESAFÍOS (30 Preguntas) ---
        // Se intercalan los 3 tipos: ImageWord (Palabras), TextType (Tipos de Texto), BookCover (Partes del Libro)
        const allChallenges = [
            // 1 al 10
            { type: 'ImageWord', img: '🍜', correct: 'sopa', options: ['sopa', 'sapo', 'sapa'], question: '¿Qué es esto?' },
            { type: 'TextType', target: 'poema', question: '¿Cuál de estos textos tiene la forma de un POEMA?' },
            { type: 'BookCover', target: 'titulo', question: 'Toca el TÍTULO de este libro.', book: { titulo: 'El León Valiente', autor: 'Ana Gómez', distractor: 'Editorial Luna' } },
            { type: 'ImageWord', img: '🐱', correct: 'gato', options: ['gota', 'pato', 'gato'], question: '¿Qué es esto?' },
            { type: 'TextType', target: 'receta', question: '¿Cuál de estos textos es una RECETA de cocina?' },
            { type: 'BookCover', target: 'autor', question: 'Toca el nombre del AUTOR de este libro.', book: { titulo: 'La Princesa', autor: 'María Sol', distractor: 'Ilustrador: Luis' } },
            { type: 'ImageWord', img: '🌙', correct: 'luna', options: ['lana', 'luna', 'cuna'], question: '¿Qué es esto?' },
            { type: 'TextType', target: 'noticia', question: '¿Cuál de estos textos se ve como una NOTICIA?' },
            { type: 'BookCover', target: 'titulo', question: 'Toca el TÍTULO de este libro.', book: { titulo: 'Viaje al Espacio', autor: 'Carlos Ruiz', distractor: 'Ed. Sol' } },
            { type: 'ImageWord', img: '☀️', correct: 'sol', options: ['sal', 'gol', 'sol'], question: '¿Qué es esto?' },
            
            // 11 al 20
            { type: 'TextType', target: 'poema', question: '¿Cuál de estos textos es un POEMA?' },
            { type: 'BookCover', target: 'autor', question: 'Toca el nombre del AUTOR de este libro.', book: { titulo: 'El Árbol Mágico', autor: 'Pedro Paz', distractor: 'Dibujos: Ana' } },
            { type: 'ImageWord', img: '🏠', correct: 'casa', options: ['cama', 'copa', 'casa'], question: '¿Qué es esto?' },
            { type: 'TextType', target: 'receta', question: '¿Cuál de estos textos es una RECETA?' },
            { type: 'BookCover', target: 'titulo', question: 'Toca el TÍTULO de este libro.', book: { titulo: 'Mis Mascotas', autor: 'Leo Gómez', distractor: 'Editorial Estrella' } },
            { type: 'ImageWord', img: '🦆', correct: 'pato', options: ['pito', 'pato', 'palo'], question: '¿Qué es esto?' },
            { type: 'TextType', target: 'noticia', question: '¿Cuál de estos textos es una NOTICIA?' },
            { type: 'BookCover', target: 'autor', question: 'Toca el nombre del AUTOR de este libro.', book: { titulo: 'Cuentos de Noche', autor: 'Luz Marina', distractor: 'Ed. Sueños' } },
            { type: 'ImageWord', img: '☝️', correct: 'dedo', options: ['dedo', 'dado', 'dudo'], question: '¿Qué es esto?' },
            { type: 'TextType', target: 'poema', question: '¿Cuál de estos textos tiene la forma de un POEMA?' },
            
            // 21 al 30
            { type: 'BookCover', target: 'titulo', question: 'Toca el TÍTULO de este libro.', book: { titulo: 'El Ratón Pérez', autor: 'Tito Silva', distractor: 'Ilustraciones: Mía' } },
            { type: 'ImageWord', img: '🐻', correct: 'oso', options: ['ojo', 'oro', 'oso'], question: '¿Qué es esto?' },
            { type: 'TextType', target: 'receta', question: '¿Cuál de estos textos es una RECETA de cocina?' },
            { type: 'BookCover', target: 'autor', question: 'Toca el nombre del AUTOR de este libro.', book: { titulo: 'Aventuras del Mar', autor: 'Sara Río', distractor: 'Ed. Océano' } },
            { type: 'ImageWord', img: '🌸', correct: 'flor', options: ['flan', 'flor', 'farol'], question: '¿Qué es esto?' },
            { type: 'TextType', target: 'noticia', question: '¿Cuál de estos textos se ve como una NOTICIA?' },
            { type: 'BookCover', target: 'titulo', question: 'Toca el TÍTULO de este libro.', book: { titulo: 'Dinosaurios', autor: 'Max Dino', distractor: 'Editorial Rex' } },
            { type: 'ImageWord', img: '🍎', correct: 'manzana', options: ['mañana', 'campana', 'manzana'], question: '¿Qué es esto?' },
            { type: 'TextType', target: 'poema', question: '¿Cuál de estos textos es un POEMA?' },
            { type: 'BookCover', target: 'autor', question: 'Toca el nombre del AUTOR de este libro.', book: { titulo: 'Superhéroes', autor: 'Ian Cruz', distractor: 'Ilustrador: Teo' } }
        ];

        // --- VARIABLES DE ESTADO ---
        let currentIndex = 0;
        let score = 0;
        let isAnimating = false;
        let currentQuestionFailed = false; // Indica si ya se equivocó en la pregunta actual
        let mistakes = []; // Guarda los errores para el feedback final

        // --- REFERENCIAS AL DOM ---
        const screenStart = document.getElementById('screen-start');
        const screenGame = document.getElementById('screen-game');
        const screenEnd = document.getElementById('screen-end');
        const questionText = document.getElementById('question-text');
        const interactiveArea = document.getElementById('interactive-area');
        const progressBar = document.getElementById('progress-bar');
        const progressText = document.getElementById('progress-text');
        const scoreText = document.getElementById('score-text');

        // --- FUNCIONES UTILITARIAS ---
        function shuffleArray(array) {
            const arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        // --- LÓGICA DEL JUEGO ---
        function startGame() {
            currentIndex = 0;
            score = 0;
            mistakes = [];
            updateHUD();
            screenStart.classList.add('hidden');
            screenEnd.classList.add('hidden');
            screenGame.classList.remove('hidden');
            screenGame.classList.add('flex');
            loadQuestion();
        }

        function resetGame() {
            startGame();
        }

        function updateHUD() {
            progressText.innerText = `${currentIndex + 1} / ${allChallenges.length}`;
            progressBar.style.width = `${((currentIndex) / allChallenges.length) * 100}%`;
            scoreText.innerText = `⭐ ${score}`;
        }

        function loadQuestion() {
            if (currentIndex >= allChallenges.length) {
                endGame();
                return;
            }

            isAnimating = false;
            currentQuestionFailed = false; // Reiniciamos el estado de error al cargar nueva pregunta
            updateHUD();
            screenStart.classList.add('hidden');
            screenEnd.classList.add('hidden');
            screenGame.classList.remove('hidden');
            screenGame.classList.add('flex');
            loadQuestion();
        }

        function resetGame() {
            startGame();
        }

        function updateHUD() {
            progressText.innerText = `${currentIndex + 1} / ${allChallenges.length}`;
            progressBar.style.width = `${((currentIndex) / allChallenges.length) * 100}%`;
            scoreText.innerText = `⭐ ${score}`;
        }

        function loadQuestion() {
            if (currentIndex >= allChallenges.length) {
                endGame();
                return;
            }

            isAnimating = false;
            updateHUD();
            const challenge = allChallenges[currentIndex];
            questionText.innerText = challenge.question;
            interactiveArea.innerHTML = ''; // Limpiar área

            if (challenge.type === 'ImageWord') {
                renderImageWord(challenge);
            } else if (challenge.type === 'TextType') {
                renderTextType(challenge);
            } else if (challenge.type === 'BookCover') {
                renderBookCover(challenge);
            }
        }

        // --- RENDERIZADORES ESPECÍFICOS POR TIPO DE PREGUNTA ---

        // 1. Renderizar: Imagen y Palabra (Sopa de letras básica visual)
        function renderImageWord(challenge) {
            const container = document.createElement('div');
            container.className = 'flex flex-col items-center w-full gap-8';

            // Imagen (Emoji grande)
            const imgEl = document.createElement('div');
            imgEl.className = 'text-8xl md:text-9xl drop-shadow-lg mb-4';
            imgEl.innerText = challenge.img;
            container.appendChild(imgEl);

            // Botones de opciones
            const optionsContainer = document.createElement('div');
            optionsContainer.className = 'flex flex-col sm:flex-row gap-4 w-full max-w-md justify-center';
            
            const shuffledOptions = shuffleArray(challenge.options);
            
            shuffledOptions.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'flex-1 bg-white border-4 border-blue-200 text-blue-700 text-3xl font-black py-4 px-6 rounded-2xl shadow-[0_6px_0_#bfdbfe] hover:shadow-[0_3px_0_#bfdbfe] hover:translate-y-1 transition-all uppercase';
                btn.innerText = opt;
                btn.onclick = () => handleAnswer(opt === challenge.correct, btn);
                optionsContainer.appendChild(btn);
            });

            container.appendChild(optionsContainer);
            interactiveArea.appendChild(container);
        }

        // 2. Renderizar: Tipos de Texto (Ejemplos Reales)
        function renderTextType(challenge) {
            const container = document.createElement('div');
            container.className = 'flex flex-wrap justify-center gap-6 md:gap-10 w-full';

            const types = ['poema', 'noticia', 'receta'];
            const shuffledTypes = shuffleArray(types);

            shuffledTypes.forEach(type => {
                const docWrapper = document.createElement('div');
                docWrapper.className = 'flex flex-col items-center gap-4';

                const doc = document.createElement('div');
                doc.className = `real-doc real-${type === 'noticia' ? 'news' : type === 'receta' ? 'recipe' : 'poem'}`;
                
                // Construir interior del documento con textos reales
                if (type === 'poema') {
                    doc.innerHTML = `
                        <h4>La mariposa</h4>
                        <p>Mariposa del aire,</p>
                        <p>qué hermosa eres,</p>
                        <p>mariposa del aire</p>
                        <p>dorada y verde.</p>
                        <div class="mt-4 text-3xl">🦋</div>
                    `;
                } else if (type === 'noticia') {
                    doc.innerHTML = `
                        <div class="header">EL DIARIO</div>
                        <div class="headline">¡PERRO SALVA A UN GATITO!</div>
                        <div class="img-placeholder">🐶🐱</div>
                        <div class="content">
                            <div class="text">Ayer en el parque, un valiente perro rescató a un gatito que no podía bajar de un árbol muy alto. ¡Todos aplaudieron!</div>
                        </div>
                    `;
                } else if (type === 'receta') {
                    doc.innerHTML = `
                        <h4>Limonada 🍋</h4>
                        <div class="section-title">Ingredientes:</div>
                        <ul class="list-disc">
                            <li>2 limones</li>
                            <li>Agua fría</li>
                            <li>Azúcar</li>
                        </ul>
                        <div class="section-title">Preparación:</div>
                        <ol class="list-decimal">
                            <li>Exprime el limón.</li>
                            <li>Mezcla con agua.</li>
                        </ol>
                    `;
                }

                doc.onclick = () => handleAnswer(type === challenge.target, doc);
                
                docWrapper.appendChild(doc);
                container.appendChild(docWrapper);
            });

            interactiveArea.appendChild(container);
        }

        // 3. Renderizar: Portada de Libro
        function renderBookCover(challenge) {
            const book = document.createElement('div');
            book.className = 'book-cover transform rotate-[-2deg] hover:rotate-0 transition-transform duration-300';

            // Zonas interactivas
            const zones = [
                { id: 'titulo', text: challenge.book.titulo, classes: 'zone-title mb-4' },
                { id: 'autor', text: challenge.book.autor, classes: 'zone-author' },
                { id: 'distractor', text: challenge.book.distractor, classes: 'zone-distractor' }
            ];

            zones.forEach(zone => {
                const el = document.createElement('div');
                el.className = `book-zone ${zone.classes}`;
                el.innerHTML = `<h3>${zone.text}</h3>`;
                el.onclick = () => handleAnswer(zone.id === challenge.target, el);
                book.appendChild(el);
            });

            interactiveArea.appendChild(book);
        }

        // --- MANEJO DE RESPUESTAS Y FEEDBACK ---
        function handleAnswer(isCorrect, element) {
            if (isAnimating) return; // Prevenir múltiples clics
            isAnimating = true;

            if (isCorrect) {
                // Éxito
                element.classList.add('animate-bounce-success');
                
                // Solo suma puntos si la responde bien a la primera
                if (!currentQuestionFailed) {
                    score++;
                }
                
                scoreText.innerText = `⭐ ${score}`;
                scoreText.classList.add('scale-150', 'text-green-500');
                setTimeout(() => scoreText.classList.remove('scale-150', 'text-green-500'), 300);

                // Esperar y pasar a la siguiente (Solo si es correcta)
                setTimeout(() => {
                    currentIndex++;
                    loadQuestion();
                }, 1200);
            } else {
                // Error
                element.classList.add('animate-shake-error');
                
                if (!currentQuestionFailed) {
                    currentQuestionFailed = true;
                    mistakes.push(allChallenges[currentIndex]); // Registramos qué le costó
                }

                // Esperar a que termine la animación roja y dejarlo intentar de nuevo
                setTimeout(() => {
                    element.classList.remove('animate-shake-error');
                    isAnimating = false; 
                }, 600);
            }
        }

        // --- FIN DEL JUEGO ---
        function endGame() {
            screenGame.classList.add('hidden');
            screenGame.classList.remove('flex');
            screenEnd.classList.remove('hidden');
            screenEnd.classList.add('flex');
            
            const finalScoreEl = document.getElementById('final-score');
            finalScoreEl.innerText = `${score} / ${allChallenges.length}`;
            
            // Efecto visual final dependiendo del puntaje
            finalScoreEl.className = 'text-6xl font-black mt-2 ';
            if(score === allChallenges.length) {
                finalScoreEl.classList.add('text-green-500');
            } else if (score > allChallenges.length * 0.6) {
                finalScoreEl.classList.add('text-blue-500');
            } else {
                finalScoreEl.classList.add('text-orange-500');
            }

            // --- GENERAR FEEDBACK ---
            const feedbackContainer = document.getElementById('feedback-container');
            feedbackContainer.innerHTML = '';
            
            if (mistakes.length === 0) {
                feedbackContainer.classList.add('hidden');
            } else {
                feedbackContainer.classList.remove('hidden');
                
                let feedbackHTML = '<h3 class="text-xl font-black text-blue-800 mb-4">💡 Para seguir mejorando:</h3><ul class="flex flex-col gap-3 text-slate-700 font-bold text-sm md:text-base">';
                
                const hasWordMistakes = mistakes.some(m => m.type === 'ImageWord');
                const hasTextMistakes = mistakes.some(m => m.type === 'TextType');
                const hasBookMistakes = mistakes.some(m => m.type === 'BookCover');

                if (hasWordMistakes) {
                    feedbackHTML += '<li class="flex items-start gap-2 bg-white p-3 rounded-lg shadow-sm border border-blue-100"><span class="text-2xl">👀</span><span><strong>Lectura con cuidado:</strong> Vuelve a practicar leyendo las palabras fijándote muy bien en cada letra (cuidado con palabras parecidas como sopa y sapo).</span></li>';
                }
                if (hasTextMistakes) {
                    feedbackHTML += '<li class="flex items-start gap-2 bg-white p-3 rounded-lg shadow-sm border border-blue-100"><span class="text-2xl">📄</span><span><strong>Forma de los textos:</strong> Observa la silueta de lejos. Los poemas son cortitos, las noticias tienen títulos grandes e imágenes, y las recetas tienen listas paso a paso.</span></li>';
                }
                if (hasBookMistakes) {
                    feedbackHTML += '<li class="flex items-start gap-2 bg-white p-3 rounded-lg shadow-sm border border-blue-100"><span class="text-2xl">📚</span><span><strong>Partes del libro:</strong> Recuerda que el <em>Título</em> es el nombre del libro (letra más grande) y el <em>Autor</em> es el nombre de la persona que lo escribió.</span></li>';
                }

                feedbackHTML += '</ul>';
                feedbackContainer.innerHTML = feedbackHTML;
            }
        }

    </script>
</body>
</html>
